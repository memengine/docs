<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#F8FAFC"/>
  <rect x="70" y="70" width="1060" height="620" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="120" y="135" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">API Keys</text>
  <text x="120" y="175" fill="#475569" font-family="Arial, sans-serif" font-size="18">Create tenant API keys for server-side SDK and REST calls.</text>
  <rect x="120" y="225" width="960" height="92" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="155" y="265" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Production server key</text>
  <text x="155" y="294" fill="#475569" font-family="Arial, sans-serif" font-size="17">mem_live_••••••••••••••••</text>
  <rect x="840" y="247" width="190" height="48" rx="12" fill="#171717"/>
  <text x="887" y="278" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Create key</text>
  <rect x="120" y="370" width="960" height="160" rx="18" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="155" y="420" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Keep keys server-side</text>
  <text x="155" y="458" fill="#92400E" font-family="Arial, sans-serif" font-size="18">Never expose MemoryOS API keys in browser code, mobile apps, or public repos.</text>
  <text x="155" y="490" fill="#92400E" font-family="Arial, sans-serif" font-size="18">Load keys from environment variables such as MEMORYOS_API_KEY.</text>
</svg>
